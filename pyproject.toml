
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tube-assistant"
version = "1.1.0"
description = "Autonomous YouTube content pipeline — script → TTS → clips → montage → upload"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "edge-tts>=6.1.9",
    "requests>=2.31.0",
    "moviepy>=2.0.0",
    "Pillow>=10.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=22.0",
    "ddgs>=9.0.0",
    "gTTS>=2.5.0",
    "rich>=13.0.0",
]

# SDK provider AI: installa solo quello che usi, es. `pip install tube-assistant[openai]`.
# OpenRouter e Ollama (i default del wizard) usano `requests`: nessun extra richiesto.
[project.optional-dependencies]
openai = ["openai>=1.30.0"]            # vale anche per deepseek/xai/together/perplexity/fireworks/azure
anthropic = ["anthropic>=0.25.0"]
gemini = ["google-generativeai>=0.7.0"]
mistral = ["mistralai>=1.0.0"]
groq = ["groq>=0.9.0"]
cohere = ["cohere>=5.0.0"]
huggingface = ["huggingface-hub>=0.23.0"]
all = [
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.7.0",
    "mistralai>=1.0.0",
    "groq>=0.9.0",
    "cohere>=5.0.0",
    "huggingface-hub>=0.23.0",
]

[project.scripts]
tube-assistant = "youtube_ai_agent.cli:main"

[tool.setuptools]
py-modules = ["agent", "main", "wizard"]
# Install both youtube_ai_agent/ (CLI) and moduli/ (core logic) as top-level packages.
# This means `from moduli.xxx import yyy` continues to work unchanged in all modules.
# `youtube_ai_agent.assets` maps the repo-level assets/ directory (kept there so the
# README raw links and `python agent.py` from a git clone keep working) into the
# wheel as youtube_ai_agent/assets/: without it `uv tool install git+...` shipped no
# background music and no .env template, and `_workspace.scaffold` copied nothing.
packages = ["moduli", "youtube_ai_agent", "youtube_ai_agent.assets", "youtube_ai_agent.template"]

[tool.setuptools.package-dir]
"youtube_ai_agent.assets" = "assets"

[tool.setuptools.package-data]
"youtube_ai_agent.assets" = ["**/*.mp3", "*.png"]
"youtube_ai_agent.template" = [".env.example"]
